<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Reader</title>
    <link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>RSS Reader</h1>
                <button class="btn-icon" id="refreshAll" title="Refresh all feeds">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-actions">
                <button class="btn btn-primary" id="addFeed">+ Add Feed</button>
            </div>

            <nav class="nav-list">
                <div class="nav-item active" data-view="all">
                    <span class="nav-icon">📰</span>
                    <span class="nav-label">All Items</span>
                    <span class="nav-count" id="allCount">0</span>
                </div>
                <div class="nav-item" data-view="starred">
                    <span class="nav-icon">⭐</span>
                    <span class="nav-label">Starred</span>
                    <span class="nav-count" id="starredCount">0</span>
                </div>
                <div class="nav-item" data-view="thumbsUp">
                    <span class="nav-icon">👍</span>
                    <span class="nav-label">Liked</span>
                    <span class="nav-count" id="thumbsUpCount">0</span>
                </div>
                <div class="nav-item" data-view="thumbsDown">
                    <span class="nav-icon">👎</span>
                    <span class="nav-label">Disliked</span>
                    <span class="nav-count" id="thumbsDownCount">0</span>
                </div>
            </nav>

            <div class="folders-section">
                <div class="section-header">
                    <span>Folders</span>
                    <button class="btn-icon" id="addFolder" title="Add folder">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </button>
                </div>
                <div class="folder-list" id="folderList"></div>
            </div>

            <div class="feeds-section">
                <div class="section-header">
                    <span>Feeds</span>
                </div>
                <div class="feed-list" id="feedList"></div>
            </div>
        </aside>

        <!-- Article List -->
        <main class="article-list-panel">
            <div class="article-list-header">
                <h2 id="currentViewTitle">All Items</h2>
                <div class="article-list-actions">
                    <button class="btn btn-secondary" id="toggleUnread">Unread only</button>
                    <button class="btn btn-secondary" id="markAllRead">Mark all read</button>
                </div>
            </div>
            <div class="article-list" id="articleList"></div>
        </main>

        <!-- Article View -->
        <article class="article-view-panel" id="articleView">
            <div class="article-view-placeholder">
                <p>Select an article to read</p>
            </div>
        </article>
    </div>

    <!-- Add Feed Modal -->
    <div class="modal" id="addFeedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Feed</h3>
                <button class="btn-icon modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="feedUrl">Feed URL</label>
                    <input type="url" id="feedUrl" placeholder="https://example.com/feed.xml">
                </div>
                <div class="form-group">
                    <label for="feedFolder">Folder (optional)</label>
                    <select id="feedFolder">
                        <option value="">No folder</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="submitFeed">Add Feed</button>
            </div>
        </div>
    </div>

    <!-- Add Folder Modal -->
    <div class="modal" id="addFolderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Folder</h3>
                <button class="btn-icon modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="folderName">Folder Name</label>
                    <input type="text" id="folderName" placeholder="News">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="submitFolder">Create Folder</button>
            </div>
        </div>
    </div>

    <!-- Rename Feed Modal -->
    <div class="modal" id="renameFeedModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Rename Feed</h3>
                <button class="btn-icon modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="feedNewName">Feed Name</label>
                    <input type="text" id="feedNewName" placeholder="Feed name">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancel</button>
                <button class="btn btn-primary" id="submitRenameFeed">Save</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
